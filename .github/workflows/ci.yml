# ─────────────────────────────────────────────────────────────────────────────
#  CI — format → verify → build (per service in parallel)
#
#  Runs on every push to `main` / `v*.*.*` tags and every PR. Does NOT push
#  images or touch any cluster — that's the CD workflow
#  (.github/workflows/cd.yml), which runs only after a green CI on `main`.
#
#  Best-practice notes for anyone editing this file:
#    • Pinned runner (`ubuntu-24.04`, not `-latest`) for reproducibility.
#    • Workflow-level `permissions: contents: read` — least privilege.
#    • `concurrency.cancel-in-progress: true` cancels stale runs on the same
#      ref to keep the queue moving on PR pushes.
#    • Per-service matrix gives one row per service in the Actions UI so a
#      failed `verify · web` is visually obvious without opening logs.
#    • `ci-summary` rollup job exposes a single status check ("CI summary")
#      that branch protection rules can require, instead of having to enumerate
#      every matrix cell.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.prettierrc'
      - '.prettierignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.prettierrc'
      - '.prettierignore'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cd.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVICES: '["api-gateway","user-svc","shop-svc","order-svc","web"]'

jobs:
  # ─── Stage 1 ─ Workspace-level format check ───────────────────────────────
  format:
    name: Format · prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24 + pnpm + install
        uses: ./.github/actions/setup-pnpm-node

      - name: pnpm run format:check
        run: pnpm run format:check

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Format"
            echo ""
            echo "Workspace-wide \`prettier --check\` completed with status **${{ job.status }}**."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Stage 2 ─ Per-service lint + typecheck + test ────────────────────────
  verify:
    name: Verify · ${{ matrix.service }}
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, user-svc, shop-svc, order-svc, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node 24 + pnpm + install
        uses: ./.github/actions/setup-pnpm-node

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ matrix.service }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.service }}-

      - name: Lint + typecheck + test (turbo)
        run: pnpm exec turbo run lint typecheck test --filter=@shop/${{ matrix.service }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Verify · \`${{ matrix.service }}\`"
            echo ""
            echo "lint + typecheck + test → **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Stage 3 ─ Per-service build (TS / Vite output, no Docker) ────────────
  build:
    name: Build · ${{ matrix.service }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, user-svc, shop-svc, order-svc, web]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node 24 + pnpm + install
        uses: ./.github/actions/setup-pnpm-node

      - name: Restore Turbo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ matrix.service }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.service }}-

      - name: Build (turbo)
        run: pnpm exec turbo run build --filter=@shop/${{ matrix.service }}

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build · \`${{ matrix.service }}\`"
            echo ""
            echo "turbo build → **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Stage 4 ─ GraphQL schema + codegen drift guard ───────────────────────
  #
  # The api-gateway is code-first: resolvers are the source of truth and
  # `apps/api-gateway/src/schema.gql` is regenerated at every dev boot. The
  # contract then flows: gateway SDL → @shop/graphql-schema → web codegen.
  # We verify each hop independently so failures point at exactly which
  # commit step the developer skipped.
  #
  # Order matters here: we MUST diff the committed schema files before
  # building @shop/graphql-schema, because that package's prebuild copies
  # the gateway SDL into its own folder and would mask staleness checks.
  schema:
    name: Schema · drift guard
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node 24 + pnpm + install
        uses: ./.github/actions/setup-pnpm-node

      # Build only the gateway here — its `dist/scripts/emit-schema.js` is
      # what `schema:check` invokes. We deliberately skip
      # @shop/graphql-schema's build because its prebuild rewrites
      # `packages/graphql-schema/schema.graphql` from the gateway source,
      # which would defeat the staleness diff in the next step.
      - name: Build api-gateway
        run: pnpm exec turbo run build --filter=@shop/api-gateway

      # 1/3 — Resolvers ↔ committed gateway SDL.
      - name: Resolvers ↔ committed SDL
        run: pnpm --filter @shop/api-gateway run schema:check

      # 2/3 — Gateway SDL ↔ @shop/graphql-schema bundled SDL.
      - name: Schema package mirrors gateway SDL
        run: |
          set -euo pipefail
          diff -u apps/api-gateway/src/schema.gql packages/graphql-schema/schema.graphql || {
            echo "::error::packages/graphql-schema/schema.graphql is out of sync with apps/api-gateway/src/schema.gql.";
            echo "Run 'pnpm --filter @shop/graphql-schema run build' and commit the result.";
            exit 1;
          }

      # 3/3 — Web's `__generated__/` ↔ current schema + queries.
      #
      # `codegen:check` runs `graphql-codegen` against the workspace-linked
      # `@shop/graphql-schema/schema.graphql` and then `git diff --exit-code`
      # on `src/__generated__`. This catches BOTH:
      #   - "schema changed but codegen wasn't re-run" (stale generated types
      #     hide a runtime contract break that typecheck cannot see)
      #   - "schema removed a field still referenced by a `gql` template
      #     literal in the source" (codegen itself errors out)
      - name: Web codegen ↔ schema
        run: pnpm --filter @shop/web run codegen:check

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Schema drift guard"
            echo ""
            echo "Verified the full contract chain → **${{ job.status }}**"
            echo ""
            echo "1. Gateway resolvers ↔ committed \`apps/api-gateway/src/schema.gql\`"
            echo "2. Gateway SDL ↔ \`@shop/graphql-schema\`'s bundled SDL"
            echo "3. \`@shop/graphql-schema\` ↔ \`apps/web/src/__generated__/\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Rollup ─ Single required check for branch protection ─────────────────
  ci-summary:
    name: CI summary
    needs: [format, verify, build, schema]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Aggregate
        run: |
          set -euo pipefail
          F='${{ needs.format.result }}'
          V='${{ needs.verify.result }}'
          B='${{ needs.build.result }}'
          S='${{ needs.schema.result }}'
          {
            echo "# CI rollup"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Format            | $F |"
            echo "| Verify (matrix×5) | $V |"
            echo "| Build  (matrix×5) | $B |"
            echo "| Schema drift      | $S |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$F" != 'success' ] || [ "$V" != 'success' ] || [ "$B" != 'success' ] || [ "$S" != 'success' ]; then
            echo "::error::At least one CI stage was not successful (format=$F verify=$V build=$B schema=$S)"
            exit 1
          fi
          echo "::notice::All CI stages passed."
